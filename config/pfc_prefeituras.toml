# =============================================================================
# Municípios do painel PREFEITURAS — Dashboard PFC
# =============================================================================
# ESTE É O ARQUIVO PARA EDITAR quando o PFC entrar/sair de um município.
# Depois de editar, rode:  python -m src.prefeituras
#
# `cod_ibge` NÃO é digitado à mão: foi resolvido a partir de
# data/ibge_regioes_imediatas_sp.csv (IBGE 2017, já versionado no projeto) e é
# RECONFERIDO contra esse arquivo toda vez que a config é carregada
# (src/prefeituras/config.py). Código que não bater derruba com erro explícito —
# nunca é preenchido por aproximação.
#
# `regiao_imediata` vem do mesmo arquivo e serve para o mapa de expansão
# (municípios vizinhos), igual ao que o painel de Emendas já faz.
# =============================================================================

