name: Verificar canais de parceria

# Procura, no site de cada parceiro da base curada, a página de
# doação/patrocínio/edital. Gera data/parcerias_verificacao.csv e commita.
#
# O QUE O RESULTADO AFIRMA: existe a página, aqui está a URL e o trecho.
# O QUE NÃO AFIRMA: que há programa aberto agora. Indício não é prova.
#
# Mensal porque canal institucional muda devagar — e porque a verificação
# envelhece: o CSV guarda a data em que cada canal foi visto.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 5 * *"      # 06:00 Brasília, dia 5 de cada mês

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install requests beautifulsoup4
      - name: Verificar canais
        timeout-minutes: 12
        run: python scripts/verificar_parcerias.py
      - name: Commitar a verificação
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parcerias_verificacao.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nada mudou — nenhum commit."
          else
            git commit -m "dados: verificação dos canais de parceria"
            git push origin HEAD:${{ github.ref_name }}
          fi
