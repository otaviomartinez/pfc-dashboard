name: Sonda Fiscal (só diagnóstico)

# Por que um workflow SÓ para sondar: antes de escrever coletor, a gente
# pergunta à fonte e LÊ a resposta. Foi assim que se descobriu que o SICONFI
# não publica o Anexo 08 (MDE) e que o cadastro de CNPJ não tem e-mail de
# prefeitura. Esta sonda NÃO grava nada e NÃO commita nada.
#
# `alvo` escolhe a sonda: "fiscal" (padrão, RGF/FPM/CAUC) ou "fontes_radar"
# (as fontes do radar de editais que vêm vazias + candidatas novas). As duas
# moram aqui porque um workflow NOVO às vezes não é registrado pelo GitHub
# quando publicado por este ambiente — este já está registrado e aceita disparo.
on:
  workflow_dispatch:
    inputs:
      alvo:
        description: "Qual sonda rodar: fiscal, fontes_radar, prosas, prosas_crivo, emendas_deputados ou contatos_deputados"
        required: false
        default: "fiscal"

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sondar RGF / FPM / CAUC
        if: ${{ github.event.inputs.alvo != 'fontes_radar' && github.event.inputs.alvo != 'prosas' && github.event.inputs.alvo != 'prosas_crivo' && github.event.inputs.alvo != 'emendas_deputados' && github.event.inputs.alvo != 'contatos_deputados' }}
        run: python scripts/sondar_fiscal.py
      - name: Instalar dependências do radar
        if: ${{ github.event.inputs.alvo == 'fontes_radar' || github.event.inputs.alvo == 'prosas' || github.event.inputs.alvo == 'prosas_crivo' }}
        run: pip install -r radar/requirements.txt
      - name: Sondar as fontes do radar
        if: ${{ github.event.inputs.alvo == 'fontes_radar' }}
        run: python scripts/sondar_fontes_radar.py
      - name: Navegador sem tela (Playwright) para o Prosas
        if: ${{ github.event.inputs.alvo == 'prosas' }}
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Sondar o Prosas (site em JavaScript)
        if: ${{ github.event.inputs.alvo == 'prosas' }}
        run: python scripts/sondar_prosas.py
      - name: Crivo do radar nos editais do Prosas
        if: ${{ github.event.inputs.alvo == 'prosas_crivo' }}
        run: python scripts/sondar_prosas_crivo.py
      - name: Emendas linha a linha + ficha ALESP de deputados
        if: ${{ github.event.inputs.alvo == 'emendas_deputados' }}
        run: pip install -q -r requirements.txt && python scripts/sondar_emendas_deputados.py
      - name: Conferir na fonte os contatos de escritório dos deputados
        if: ${{ github.event.inputs.alvo == 'contatos_deputados' }}
        run: pip install -q requests && python scripts/sondar_contatos_deputados.py
